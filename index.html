<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santiago Fleitas | README Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="config.js" type="module"></script>
    <style>
        :root {
            --primary: #2d333b;
            --secondary: #22272e;
            --accent: #539bf5;
            --text: #adbac7;
            --highlight: #768390;
            --success: #57ab5a;
            --warning: #e0b341;
            --danger: #e5534b;
            --code-bg: #1c2128;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary);
            color: var(--text);
            padding: 20px;
        }

        .readme-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--primary);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(83, 155, 245, 0.5);
            background: linear-gradient(90deg, #539bf5, #57ab5a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--highlight);
            font-style: italic;
        }

        .section {
            margin-bottom: 40px;
            border-radius: 8px;
            padding: 20px;
            background-color: rgba(28, 33, 40, 0.5);
            border-left: 4px solid var(--accent);
        }

        .section h2 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section h2 i {
            font-size: 1.5rem;
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .about-text {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .about-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .about-item i {
            width: 30px;
            color: var(--accent);
            margin-right: 10px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .skill-category {
            margin-bottom: 25px;
        }

        .skill-category h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--highlight);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-bar {
            height: 10px;
            background: var(--code-bg);
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .skill-level {
            height: 100%;
            border-radius: 5px;
            transition: width 1s ease-in-out;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tech-badge {
            padding: 8px 15px;
            border-radius: 20px;
            background-color: var(--code-bg);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tech-badge:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }

        .project-card {
            background-color: var(--code-bg);
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .project-card h3 {
            color: var(--accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-card p {
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .project-card .tech-stack {
            margin-top: auto;
        }

        .project-card .tech-stack .tech-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stat-card {
            background-color: var(--code-bg);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: var(--accent);
            margin-bottom: 10px;
        }

        .github-activity {
            margin-top: 20px;
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .activity-day {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            background-color: var(--code-bg);
            transition: transform 0.2s;
        }

        .activity-day:hover {
            transform: scale(1.2);
        }

        .level-0 { background-color: var(--code-bg); }
        .level-1 { background-color: #0e4429; }
        .level-2 { background-color: #006d32; }
        .level-3 { background-color: #26a641; }
        .level-4 { background-color: #39d353; }

        .achievement-list {
            margin-top: 20px;
        }

        .achievement {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            background-color: var(--code-bg);
            padding: 10px 15px;
            border-radius: 6px;
            transition: transform 0.2s;
        }

        .achievement:hover {
            transform: translateX(5px);
        }

        .achievement i {
            color: var(--success);
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
        }

        .connect-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            background-color: var(--accent);
            color: var(--secondary);
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .connect-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .connect-button.portfolio {
            background-color: var(--success);
        }

        .connect-button.resume {
            background-color: var(--warning);
        }

        .animated-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .pixel {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 10s infinite ease-in-out;
        }

        .profile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid var(--accent);
            box-shadow: 0 0 20px rgba(83, 155, 245, 0.5);
            object-fit: cover;
        }

        .typing-effect {
            overflow: hidden;
            border-right: 3px solid var(--accent);
            white-space: nowrap;
            margin: 0 auto;
            animation: typing 3s steps(30, end), blink-caret 0.75s step-end infinite;
        }

        .github-calendar {
            width: 100%;
            margin-top: 20px;
            overflow: hidden;
            border-radius: 8px;
        }

        .wakatime-stats {
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--accent) }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-20px) translateX(10px); }
            50% { transform: translateY(0) translateX(20px); }
            75% { transform: translateY(20px) translateX(10px); }
        }

        .quote-box {
            background-color: var(--code-bg);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            position: relative;
            font-style: italic;
            text-align: center;
        }

        .quote-box::before, .quote-box::after {
            content: '"';
            font-size: 3rem;
            color: var(--accent);
            opacity: 0.3;
            position: absolute;
        }

        .quote-box::before {
            top: 0;
            left: 10px;
        }

        .quote-box::after {
            bottom: -20px;
            right: 10px;
        }

        .trophies {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .about-content, .stats-container {
                grid-template-columns: 1fr;
            }
            
            .projects-container {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
            
            .readme-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel" src="app.js"></script>
</body>
</html>
